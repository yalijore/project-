[package]
name = "keel"
version = "0.2.0"
description = "Keel — a local-first daily planner"
authors = ["Keel contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "keel_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2"
keyring = { version = "3.6", features = ["windows-native", "apple-native", "sync-secret-service", "crypto-rust"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls-native-roots", "http2", "charset", "system-proxy"] }
sha2 = "0.10"
base64 = "0.22"
rand = "0.9"
url = "2"
tokio = { version = "1", features = ["net", "io-util", "time", "macros"] }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util", "time"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

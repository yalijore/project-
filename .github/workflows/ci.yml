# Windows only. The Windows jobs run on the machine named by the repository variable
# WINDOWS_RUNNER (Settings → Secrets and variables → Actions → Variables), a JSON list of runner
# labels such as ["self-hosted","windows"]. Without it they run on GitHub's windows-latest.
name: CI

on:
  push:
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
  workflow_dispatch:
    inputs:
      installers:
        description: Also build the installers (releases build them anyway)
        type: boolean
        default: false
      e2e:
        description: Also run the Windows UI tests (they take over the mouse and keyboard)
        type: boolean
        default: false

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows checks and tests
    runs-on: ${{ fromJSON(vars.WINDOWS_RUNNER || '"windows-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - name: Unit tests
        run: npm test
      - name: Rust lint (clippy, rustfmt)
        run: npm run lint:rust
      - name: Rust tests (MSVC, including Credential Manager)
        run: npm run test:rust
      # Releases build and publish the installers; here only on request, to save minutes.
      - name: Build installers (NSIS + MSI)
        if: github.event_name == 'workflow_dispatch' && inputs.installers
        run: npx tauri build
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'workflow_dispatch' && inputs.installers
        with:
          name: keel-windows-installers
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error

  # The UI tests drive the real app with real mouse and keyboard input (on a self-hosted runner
  # they would fight whoever is using the PC) and cost the most minutes, so they run only when
  # started by hand: Actions → CI → Run workflow → "Also run the Windows UI tests".
  e2e-windows:
    name: End-to-end (real app, Windows WebView2, focus bar)
    if: github.event_name == 'workflow_dispatch' && inputs.e2e
    runs-on: ${{ fromJSON(vars.WINDOWS_RUNNER || '"windows-latest"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: msedgedriver matching the installed WebView2
        shell: pwsh
        run: |
          cargo install --git https://github.com/chippers/msedgedriver-tool
          & "$HOME/.cargo/bin/msedgedriver-tool.exe"
          $PWD.Path >> $env:GITHUB_PATH
      - run: npm ci
      - name: E2E (core flow + focus bar acceptance)
        run: node e2e/run.mjs --only=focusbar
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-windows-screenshots
          path: e2e/.artifacts/
          include-hidden-files: true

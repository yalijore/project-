# Publishes a Keel release as a GitHub Release with the Windows installers and their SHA-256
# checksums. It runs when a commit whose version (src-tauri/tauri.conf.json) has no release yet
# is pushed to main or a claude/ branch, or when a tag like v0.2.0 is pushed. The tag is created
# here if it does not exist yet, so bumping the version is all a release needs. Like CI, it runs
# on the runner named by the WINDOWS_RUNNER repository variable, else on windows-latest.
name: Release

on:
  push:
    branches: [main, 'claude/**']
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  check:
    name: New version?
    runs-on: ${{ fromJSON(vars.WINDOWS_RUNNER || '"windows-latest"') }}
    outputs:
      version: ${{ steps.v.outputs.version }}
      publish: ${{ steps.v.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          "version=$version" >> $env:GITHUB_OUTPUT
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") {
            Write-Output "::error::Tag $env:GITHUB_REF_NAME does not match tauri.conf.json version $version"
            exit 1
          }
          gh release view "v$version" --repo $env:GITHUB_REPOSITORY *> $null
          $exists = $LASTEXITCODE -eq 0
          # A newer push to this branch has its own run, which publishes instead (the Actions
          # token may not tag an older commit once the branch's workflow files have changed).
          $superseded = $false
          if ($env:GITHUB_REF_TYPE -eq 'branch') {
            $head = gh api "repos/$env:GITHUB_REPOSITORY/branches/$env:GITHUB_REF_NAME" --jq .commit.sha
            $superseded = $head -and $head -ne $env:GITHUB_SHA
          }
          if ($superseded) {
            Write-Output "A newer commit ($head) was pushed; its run publishes v$version."
            "publish=false" >> $env:GITHUB_OUTPUT
          } elseif ($exists) {
            Write-Output "Release v$version already exists; nothing to publish."
            "publish=false" >> $env:GITHUB_OUTPUT
          } elseif (-not (Select-String -Path CHANGELOG.md -Pattern "^## $([regex]::Escape($version))\b" -Quiet)) {
            Write-Output "::warning::CHANGELOG.md has no section for $version; not publishing."
            "publish=false" >> $env:GITHUB_OUTPUT
          } else {
            "publish=true" >> $env:GITHUB_OUTPUT
          }
          $global:LASTEXITCODE = 0

  windows:
    name: Windows installers
    needs: check
    if: needs.check.outputs.publish == 'true'
    runs-on: ${{ fromJSON(vars.WINDOWS_RUNNER || '"windows-latest"') }}
    env:
      VERSION: ${{ needs.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - name: Tests
        run: |
          npm test
          cargo test --manifest-path src-tauri/Cargo.toml
      - name: Build installers (NSIS + MSI)
        run: npx tauri build
      - name: Collect installers and checksums
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item src-tauri/target/release/bundle/nsis/*.exe out/
          Copy-Item src-tauri/target/release/bundle/msi/*.msi out/
          Get-ChildItem out | ForEach-Object {
            "$((Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower())  $($_.Name)"
          } | Set-Content -Encoding ascii out/SHA256SUMS.txt
          Get-Content out/SHA256SUMS.txt
      - name: Release notes from CHANGELOG.md
        shell: pwsh
        run: |
          $lines = Get-Content CHANGELOG.md
          $start = ($lines | Select-String -Pattern "^## $([regex]::Escape($env:VERSION))\b").LineNumber
          if (-not $start) { throw "CHANGELOG.md has no section for $env:VERSION" }
          $rest = $lines[$start..($lines.Length - 1)]
          $end = ($rest | Select-String -Pattern '^## ' | Select-Object -First 1).LineNumber
          $body = if ($end) { $rest[0..($end - 2)] } else { $rest }
          $body | Set-Content -Encoding utf8 out/NOTES.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          # Pushed over while building? The newer commit's run publishes this version instead.
          if ($env:GITHUB_REF_TYPE -eq 'branch') {
            $head = gh api "repos/$env:GITHUB_REPOSITORY/branches/$env:GITHUB_REF_NAME" --jq .commit.sha
            if ($head -and $head -ne $env:GITHUB_SHA) {
              Write-Output "::notice::A newer commit ($head) was pushed; its run publishes v$env:VERSION."
              exit 0
            }
          }
          $files = Get-ChildItem out -Exclude NOTES.md | ForEach-Object { $_.FullName }
          gh release create "v$env:VERSION" $files `
            --target "${{ github.sha }}" --title "Keel $env:VERSION" --notes-file out/NOTES.md
